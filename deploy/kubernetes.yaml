# Generic example manifests for dial-pptx-mcp.
# Replace every <PLACEHOLDER> before applying; adapt to your ingress/IaC conventions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dial-pptx-mcp
  labels:
    app: dial-pptx-mcp
spec:
  # In-memory presentation state: keep 1 replica, or add session affinity
  # at the ingress/service level before scaling out (see README).
  replicas: 1
  selector:
    matchLabels:
      app: dial-pptx-mcp
  template:
    metadata:
      labels:
        app: dial-pptx-mcp
    spec:
      containers:
        - name: dial-pptx-mcp
          image: <YOUR-REGISTRY>/dial-pptx-mcp:<TAG>
          ports:
            - containerPort: 8000
          env:
            - name: PPT_MCP_TRANSPORT
              value: "http"
            - name: PPT_MCP_HOST
              value: "0.0.0.0"
            - name: PPT_MCP_PORT
              value: "8000"
            # One log line per event on stderr. DEBUG adds per-tool argument
            # summaries, vision-LLM timings and per-repair detail.
            - name: LOG_LEVEL
              value: "INFO"
            # Visual QA is driven by the agent through visual_inspect_slides
            # and visual_repair_slides (registered when VISION_LLM_* is set).
            # Uncomment to additionally make export refuse a deck that no
            # whole-deck inspection has cleared — note this re-inspects the
            # whole deck on export even if the agent already checked every
            # slide, so it roughly doubles the QA cost.
            #- name: VISUAL_QA_EXPORT_GATE
            #  value: "true"
            - name: DIAL_CORE_URL
              value: "https://<YOUR-DIAL-CORE-HOST>"
            - name: DIAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dial-pptx-mcp-secrets
                  key: dial-api-key
          # Sizing depends on whether visual QA is enabled:
          #  - deck generation only (no VISION_LLM_*): 100m CPU / 256Mi is fine.
          #  - visual QA enabled: LibreOffice renders the deck to PDF in-pod
          #    and needs far more — budget 1 CPU and 2Gi, or renders get
          #    OOM-killed and every export fails the QA gate.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # LibreOffice needs a writable temp dir for its profile and
          # conversion scratch files.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dial-pptx-mcp
spec:
  selector:
    app: dial-pptx-mcp
  ports:
    - port: 80
      targetPort: 8000
---
# Example secret (create via your secret-management tooling instead of applying plaintext):
# kubectl create secret generic dial-pptx-mcp-secrets --from-literal=dial-api-key=<YOUR-DIAL-API-KEY>
