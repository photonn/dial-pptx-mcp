# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies — requirements.txt / pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # mcp 2.x removed mcp.server.fastmcp, which this whole server is built on,
      # and the _tool_manager internals state.serialize_per_presentation patches.
      # Major bumps need a real migration PR, not a constraint widening (see #6).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # Docker base image — Dockerfile (bundles LibreOffice, deployed as the remote-transport server)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions — repo already has .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
