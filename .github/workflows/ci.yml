name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install LibreOffice (slide rendering in visual-QA tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fidelity spike against bundled demo deck
        run: python spike/fidelity_spike.py mcp_all_tools_templates_effects_demo.pptx /tmp/spike_out.pptx

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dial-pptx-mcp:ci .
