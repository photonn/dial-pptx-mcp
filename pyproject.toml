[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dial-pptx-mcp"
version = "2.3.0"
description = "Remote, multi-tenant PowerPoint-generation MCP server for EPAM AI DIAL, extending Office-PowerPoint-MCP-Server"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Miguel Martin"}
]
# Upstream project (MIT): https://github.com/GongRzhe/Office-PowerPoint-MCP-Server
# by GongRzhe — core PowerPoint tools and utilities originate there.
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.21",
    "mcp[cli]>=1.8.0,<2.0.0",
    "Pillow>=8.0.0",
    "fonttools>=4.0.0",
    "httpx>=0.27.0",
]

[project.urls]
"Homepage" = "https://github.com/photonn/dial-pptx-mcp"
"Bug Tracker" = "https://github.com/photonn/dial-pptx-mcp/issues"
"Upstream" = "https://github.com/GongRzhe/Office-PowerPoint-MCP-Server"

[tool.hatch.build.targets.wheel]
only-include = ["ppt_mcp_server.py", "state.py", "dial_client.py",
                "logging_utils.py", "visual_qa.py", "visual_fix.py",
                "tools/", "utils/", "slide_layout_templates.json"]
sources = ["."]

[tool.hatch.build]
exclude = [
  "public/demo.mp4",
  "public/demo.gif",
  "*.pptx"
]

[project.scripts]
ppt_mcp_server = "ppt_mcp_server:main"
